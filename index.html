<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KL Learning Management System: Log in to the site</title>
  <meta name="description" content="KL University Learning Management System sign-in.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23990000'/%3E%3Ctext x='16' y='23' font-family='Arial' font-size='15' font-weight='bold' fill='%23fff' text-anchor='middle'%3EKL%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="fonts/OpenSans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body class="page-login">
  <a class="skip-link" href="#main">Skip to content</a>

  <svg class="svg-defs" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="kl-red" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#C6202C"></stop>
        <stop offset=".55" stop-color="#A51219"></stop>
        <stop offset="1" stop-color="#7E0F16"></stop>
      </linearGradient>

      <symbol id="kl-logo" viewBox="0 0 209 63">
        <g fill="none" stroke="#2F2F2F">
          <circle cx="33" cy="27" r="23" stroke-width="5.5" stroke-dasharray="3 2.4"></circle>
          <circle cx="33" cy="27" r="19" fill="#fff" stroke-width="1.5"></circle>
          <circle cx="33" cy="27" r="16.4" stroke-width=".7"></circle>
        </g>
        <g fill="#8E1418">
          <path d="M25 33.5h16l-1.6 3.5H26.6z"></path>
          <path d="M28 22h2v10h-2zM37 22h2v10h-2z"></path>
          <path d="M26.5 21.5h14v1.6h-14z"></path>
          <path d="M29.5 24.5c1.5-2 5.5-2 7 0" fill="none" stroke="#8E1418" stroke-width="1"></path>
          <path d="M33 14.5v4" stroke="#8E1418" stroke-width="1.2"></path>
        </g>
        <path d="M62 8h11v16.5L91.5 8H106L83 29.5 107 50H92.5L73 31.5V50H62z" fill="url(#kl-red)"></path>
        <path d="M108 8h12v33.5h29V50h-41z" fill="url(#kl-red)"></path>
        <path d="M73 31.5 92.5 50h-7L73 39z" fill="#7E0F16" opacity=".55"></path>
        <text x="108" y="59.5" text-anchor="middle" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-size="5.6" letter-spacing="1.1" fill="#1F1F1F">(DEEMED TO BE UNIVERSITY)</text>
      </symbol>

      <symbol id="klu-mark" viewBox="0 0 112 46">
        <circle cx="18" cy="17" r="12" fill="none" stroke="#fff" stroke-width="2.2" stroke-dasharray="1.7 1.3"></circle>
        <circle cx="18" cy="17" r="9.2" fill="none" stroke="#fff" stroke-width=".9"></circle>
        <path d="M14 20.5h8l-.8 1.8h-6.4z" fill="#fff"></path>
        <path d="M15.5 12.5h1.2v5h-1.2zM20.2 12.5h1.2v5h-1.2z" fill="#fff"></path>
        <path d="M14.5 12.2h7.8v.9h-7.8z" fill="#fff"></path>
        <g fill="#fff">
          <path d="M32 4h5v10.5L45 4h6L41.5 15 51 24h-6l-8-8.5V24h-5z"></path>
          <path d="M53 4h5v16h12v4H53z"></path>
        </g>
        <text x="53" y="43" text-anchor="middle" font-family="'Open Sans',Arial,sans-serif" font-size="4" letter-spacing=".2" fill="#fff">(DEEMED TO BE UNIVERSITY)</text>
      </symbol>
    </defs>
  </svg>

  <header class="login-header">
    <a class="login-logo" href="index.html" aria-label="KL Deemed to be University — home">
      <img class="kl-logo" src="assets/kl.png" width="209" height="63" alt="KL Deemed to be University">
    </a>
  </header>

  <main class="login-main" id="main">
    <section class="login-card" aria-label="Sign in to KL Learning Management System">
      <div class="login-card__inner">

        <img class="klu-banner" src="assets/klu-banner.jpg" width="698" height="54" alt="Koneru Lakshmaiah Education Foundation, Deemed to be University — 45 years of educational excellence, ranked among all universities, Category 1 university by MHRD, Government of India, with NAAC, NIRF, QS and THE rankings.">

        <form id="login-form" class="login-form" action="dashboard.html" method="get" novalidate>
          <label class="sr-only" for="username">Username or email</label>
          <input id="username" type="text" placeholder="Username or email" autocomplete="username" autocapitalize="none" spellcheck="false" required aria-describedby="login-error">

          <label class="sr-only" for="password">Password</label>
          <input id="password" type="password" placeholder="Password" autocomplete="current-password" required aria-describedby="login-error">

          <p id="login-error" class="login-error" role="alert" aria-live="polite"></p>

          <button class="login-submit" type="submit">Log in</button>
          <a class="login-lost js-lost-password" href="#">Lost password?</a>
        </form>

        <div class="login-cookies-row">
          <button class="btn btn-green btn-cookies js-cookies" type="button">Cookies notice</button>
        </div>

      </div>
    </section>
  </main>
</body>
</html>
